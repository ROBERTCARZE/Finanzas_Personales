<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transacciones — Robert Carrillo Zeña</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="app-shell.css" />
  <link rel="stylesheet" href="transacciones.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ============ Riel de navegación ============ -->
    <aside class="rail">
      <div class="rail-brand"><img src="logo.png" alt="Robert Carrillo Zeña" /></div>

      <nav class="rail-nav">
        <a class="rail-item disabled" data-tooltip="Panel de control (próximamente)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>
        </a>
        <a class="rail-item active" href="transacciones.html" data-tooltip="Transacciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h13M17 8l-3.5-3.5M17 8l-3.5 3.5"/><path d="M20 16H7M7 16l3.5-3.5M7 16l3.5 3.5"/></svg>
        </a>
        <a class="rail-item disabled" data-tooltip="Presupuestos (próximamente)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3.5V6M12 18v2.5M3.5 12H6M18 12h2.5"/></svg>
        </a>
        <a class="rail-item" href="cuentas.html" data-tooltip="Cuentas y Activos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 9.5 12 4l8.5 5.5"/><path d="M4.5 9.5v9M9 9.5v9M15 9.5v9M19.5 9.5v9"/><path d="M3 19h18"/></svg>
        </a>
        <a class="rail-item disabled" data-tooltip="Objetivos de Ahorro (próximamente)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3.5v17"/><path d="M6 4.5h11l-3 3.5 3 3.5H6"/></svg>
        </a>
      </nav>

      <div class="rail-footer">
        <button class="rail-item" id="privacyBtn" data-tooltip="Modo discreto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="rail-item" id="logoutBtn" data-tooltip="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 20H5.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1H9"/><path d="M16 16.5 21 12l-5-4.5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <!-- ============ Área principal ============ -->
    <main class="main-area">

      <header class="page-header">
        <div>
          <h1>Transacciones</h1>
          <p class="page-subtitle">El libro diario de todos tus movimientos. Cada entrada afecta automáticamente el saldo de tu cuenta.</p>
        </div>
        <button class="btn-primary" id="newTxBtn">+ Nueva transacción</button>
      </header>

      <section class="filters-bar">
        <input type="search" id="filterSearch" placeholder="Buscar por nota o #hashtag..." />
        <select id="filterType">
          <option value="">Todos los tipos</option>
          <option value="income">Ingreso</option>
          <option value="expense">Gasto</option>
          <option value="transfer">Transferencia</option>
          <option value="debt_payment">Pago de Deuda</option>
        </select>
        <select id="filterCategory">
          <option value="">Todas las categorías</option>
        </select>
        <select id="filterAccount">
          <option value="">Todas las cuentas</option>
        </select>
        <input type="date" id="filterFrom" />
        <input type="date" id="filterTo" />
      </section>

      <section class="ledger-panel">
        <div class="ledger-panel-head">
          <span>Folio</span><span>Fecha</span><span>Detalle</span><span>Tipo</span><span style="text-align:right;">Monto</span>
        </div>
        <div class="ledger-body" id="transactionsList"></div>
      </section>

    </main>
  </div>

  <!-- ============ Panel deslizante: nueva transacción ============ -->
  <div class="tx-overlay" id="txOverlay">
    <div class="tx-drawer">
      <div class="tx-drawer-header">
        <h2>Nueva transacción</h2>
        <button class="tx-drawer-close" id="closeTxBtn">×</button>
      </div>

      <form id="txForm">

        <div class="type-toggle" id="typeToggle">
          <button type="button" data-type="income" class="active">Ingreso</button>
          <button type="button" data-type="expense">Gasto</button>
          <button type="button" data-type="transfer">Transferencia</button>
          <button type="button" data-type="debt_payment">Pago Deuda</button>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="txDate">Fecha</label>
            <input type="date" id="txDate" required />
          </div>
          <div class="field">
            <label for="txAmount">Monto</label>
            <div class="amount-input-wrap">
              <span>S/</span>
              <input type="number" id="txAmount" step="0.01" min="0" placeholder="0.00" required />
            </div>
          </div>
        </div>

        <div class="field" id="categoryField">
          <label for="txCategory">Categoría</label>
          <select id="txCategory" required></select>
        </div>
        <div class="new-category-row hidden" id="newCategoryRow">
          <input type="text" id="newCategoryInput" placeholder="Nombre de la nueva categoría" />
          <button type="button" id="addCategoryBtn">Agregar</button>
        </div>

        <div class="field">
          <label for="txAccount" id="txAccountLabel">Cuenta</label>
          <select id="txAccount" required></select>
        </div>

        <div class="field hidden" id="destinationField">
          <label for="txDestination">Cuenta destino</label>
          <select id="txDestination"></select>
        </div>

        <div class="field hidden" id="debtField">
          <label for="txDebt">Deuda que se paga</label>
          <select id="txDebt"></select>
        </div>

        <div class="field">
          <label for="txNotes">Notas</label>
          <input type="text" id="txNotes" placeholder="Ej. Compras del mes" />
        </div>

        <div class="field">
          <label for="txHashtags">Hashtags</label>
          <input type="text" id="txHashtags" placeholder="#Terreno #Gym (separados por espacio)" />
        </div>

        <button type="submit" class="btn-primary">Guardar transacción</button>
      </form>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="transacciones.js"></script>
</body>
</html>
