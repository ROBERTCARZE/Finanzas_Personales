<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Objetivos de Ahorro — Robert Carrillo Zeña</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="app-shell.css" />
  <link rel="stylesheet" href="objetivos.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ============ Riel de navegación ============ -->
    <aside class="rail">
      <div class="rail-brand"><img src="logo.png" alt="Robert Carrillo Zeña" /></div>

      <nav class="rail-nav">
        <a class="rail-item" href="dashboard.html" data-tooltip="Panel de control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>
        </a>
        <a class="rail-item" href="transacciones.html" data-tooltip="Transacciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h13M17 8l-3.5-3.5M17 8l-3.5 3.5"/><path d="M20 16H7M7 16l3.5-3.5M7 16l3.5 3.5"/></svg>
        </a>
        <a class="rail-item" href="presupuestos.html" data-tooltip="Presupuestos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3.5V6M12 18v2.5M3.5 12H6M18 12h2.5"/></svg>
        </a>
        <a class="rail-item" href="cuentas.html" data-tooltip="Cuentas y Activos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 9.5 12 4l8.5 5.5"/><path d="M4.5 9.5v9M9 9.5v9M15 9.5v9M19.5 9.5v9"/><path d="M3 19h18"/></svg>
        </a>
        <a class="rail-item active" href="objetivos.html" data-tooltip="Objetivos de Ahorro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3.5v17"/><path d="M6 4.5h11l-3 3.5 3 3.5H6"/></svg>
        </a>
        <a class="rail-item" href="recibos.html" data-tooltip="Recibos y Suscripciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M4.6 15a8 8 0 0 0 13.8 3.5M19.4 9A8 8 0 0 0 5.6 5.5"/></svg>
        </a>
        <a class="rail-item" href="flujo.html" data-tooltip="Flujo de Caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20h16"/><path d="M4.5 17l4-5 4 3 5-7 3 3"/></svg>
        </a>
        <a class="rail-item" href="pendientes.html" data-tooltip="Pendientes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="4" height="4" rx="1"/><path d="M11 7h9"/><rect x="4" y="15" width="4" height="4" rx="1"/><path d="M11 17h9"/></svg>
        </a>
      </nav>

      <div class="rail-footer">
        <button class="rail-item" id="privacyBtn" data-tooltip="Modo discreto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="rail-item" id="logoutBtn" data-tooltip="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 20H5.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1H9"/><path d="M16 16.5 21 12l-5-4.5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <!-- ============ Área principal ============ -->
    <main class="main-area">

      <header class="page-header">
        <div>
          <h1>Objetivos de Ahorro</h1>
          <p class="page-subtitle">Separa fondos con un propósito claro: fondo de emergencia, un viaje, el enganche de algo.</p>
        </div>
        <button class="btn-primary" id="newGoalBtn">+ Nuevo objetivo</button>
      </header>

      <section class="kpi-row">
        <div class="kpi-card">
          <span class="kpi-label">Ahorrado en total</span>
          <span class="kpi-value mono kpi-sage" id="kpiSaved">S/ 0.00</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Meta combinada</span>
          <span class="kpi-value mono" id="kpiTarget">S/ 0.00</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Objetivos completados</span>
          <span class="kpi-value mono" id="kpiCompleted">0 / 0</span>
        </div>
      </section>

      <section class="card-grid" id="goalsGrid"></section>

    </main>
  </div>

  <!-- ============ Drawer: objetivo ============ -->
  <div class="drawer-overlay" id="goalOverlay">
    <div class="drawer-panel">
      <div class="drawer-header">
        <h2 id="goalDrawerTitle">Nuevo objetivo</h2>
        <button class="drawer-close" id="closeGoalBtn">×</button>
      </div>

      <form id="goalForm">
        <div class="field-row">
          <div class="field icon-field">
            <label for="goalIcon">Ícono</label>
            <input type="text" id="goalIcon" maxlength="2" placeholder="🎯" />
          </div>
          <div class="field" style="flex:1;">
            <label for="goalName">Nombre</label>
            <input type="text" id="goalName" placeholder="Ej. Fondo de Emergencia" required />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="goalTarget">Monto objetivo</label>
            <div class="amount-input-wrap">
              <span>S/</span>
              <input type="number" id="goalTarget" step="0.01" min="0" required />
            </div>
          </div>
          <div class="field">
            <label for="goalCurrent">Ya ahorrado</label>
            <div class="amount-input-wrap">
              <span>S/</span>
              <input type="number" id="goalCurrent" step="0.01" min="0" value="0" />
            </div>
          </div>
        </div>

        <div class="field">
          <label for="goalDate">Fecha límite</label>
          <input type="date" id="goalDate" required />
        </div>

        <div class="field">
          <label for="goalAccount">Cuenta vinculada (opcional)</label>
          <select id="goalAccount">
            <option value="">Sin vincular (meta virtual)</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Guardar objetivo</button>
        <button type="button" class="btn-delete hidden" id="deleteGoalBtn">Eliminar objetivo</button>
      </form>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="objetivos.js"></script>
</body>
</html>
