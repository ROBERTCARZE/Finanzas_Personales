<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robert Carrillo Zeña — Acceso</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="login-shell">
    <div class="login-content">

      <img class="brand-logo" src="assets/logo.png" alt="Robert Carrillo Zeña — Tu futuro financiero, inteligente" />

      <div class="login-card">

        <div class="form-error" id="loginError">
          Correo o contraseña incorrectos.
        </div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label class="sr-only" for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="Correo Electrónico" autocomplete="email" required />
          </div>

          <div class="field">
            <label class="sr-only" for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn-primary">Ingresar</button>
        </form>

      </div>

      <div class="form-footer-minimal">
        <button type="button" class="btn-text" id="forgotBtn">Olvidé mi contraseña</button>
        <span class="mono" id="statusDot" title="Sin conexión a Firebase todavía">●</span>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
