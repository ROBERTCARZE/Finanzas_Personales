<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libro — Acceso</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="login-shell">

    <!-- Panel de marca -->
    <section class="brand-panel">
      <div>
        <div class="wordmark">Libro<span>.</span></div>
        <p class="brand-tagline">
          Un registro personal de tu patrimonio, tus compromisos y tu tiempo.
        </p>
      </div>

      <nav class="ledger-index" aria-hidden="true">
        <div class="index-row"><span class="folio">01</span> Panel de control</div>
        <div class="index-row"><span class="folio">02</span> Transacciones</div>
        <div class="index-row"><span class="folio">03</span> Presupuestos</div>
        <div class="index-row"><span class="folio">04</span> Cuentas y activos</div>
      </nav>
    </section>

    <!-- Panel de formulario -->
    <section class="form-panel">
      <div class="login-card">
        <h1>Acceso</h1>
        <p class="subtitle">Ingresa con tu cuenta autorizada.</p>

        <div class="form-error" id="loginError">
          Correo o contraseña incorrectos.
        </div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn-primary">Ingresar</button>
        </form>

        <div class="form-footer">
          <button type="button" class="btn-text" id="forgotBtn">Olvidé mi contraseña</button>
          <span class="mono" id="statusDot" title="Sin conexión a Firebase todavía">●</span>
        </div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
