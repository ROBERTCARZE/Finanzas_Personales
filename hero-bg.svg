<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E2D2"/>
      <stop offset="45%" stop-color="#C9C3B4"/>
      <stop offset="100%" stop-color="#0F3436"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F1E4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F6F1E4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#163F41"/>
      <stop offset="100%" stop-color="#0B2426"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- luz de ventana (bokeh) -->
  <circle cx="230" cy="180" r="260" fill="url(#glow)"/>
  <circle cx="1380" cy="120" r="200" fill="url(#glow)" opacity="0.6"/>

  <!-- skyline -->
  <g fill="url(#building)" opacity="0.92">
    <rect x="0" y="620" width="90" height="280"/>
    <rect x="100" y="560" width="70" height="340"/>
    <rect x="185" y="640" width="110" height="260"/>
    <rect x="310" y="500" width="60" height="400"/>
    <rect x="385" y="600" width="90" height="300"/>
    <rect x="490" y="540" width="75" height="360"/>
    <rect x="580" y="660" width="120" height="240"/>
    <rect x="1020" y="600" width="90" height="300"/>
    <rect x="1120" y="520" width="65" height="380"/>
    <rect x="1200" y="640" width="110" height="260"/>
    <rect x="1325" y="560" width="80" height="340"/>
    <rect x="1420" y="610" width="95" height="290"/>
    <rect x="1530" y="540" width="70" height="360"/>
  </g>

  <!-- ventanas encendidas -->
  <g fill="#C9A24B" opacity="0.55">
    <rect x="15" y="650" width="6" height="10"/>
    <rect x="35" y="680" width="6" height="10"/>
    <rect x="120" y="600" width="6" height="10"/>
    <rect x="140" y="640" width="6" height="10"/>
    <rect x="330" y="540" width="6" height="10"/>
    <rect x="350" y="580" width="6" height="10"/>
    <rect x="1040" y="640" width="6" height="10"/>
    <rect x="1140" y="560" width="6" height="10"/>
    <rect x="1340" y="600" width="6" height="10"/>
    <rect x="1440" y="650" width="6" height="10"/>
  </g>

  <!-- trazo de gráfico de velas / línea ascendente -->
  <g opacity="0.85">
    <polyline points="80,760 220,700 340,730 470,640 600,660 740,560 880,590 1010,480 1150,510 1290,420 1430,440 1560,340"
      fill="none" stroke="#C9A24B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#C9A24B">
      <rect x="215" y="680" width="10" height="40" opacity="0.7"/>
      <rect x="465" y="620" width="10" height="45" opacity="0.7"/>
      <rect x="735" y="540" width="10" height="45" opacity="0.7"/>
      <rect x="1005" y="460" width="10" height="45" opacity="0.7"/>
      <rect x="1285" y="400" width="10" height="45" opacity="0.7"/>
    </g>
  </g>

  <!-- viñeta inferior para legibilidad -->
  <rect x="0" y="700" width="1600" height="200" fill="#0F3436" opacity="0.35"/>
</svg>
